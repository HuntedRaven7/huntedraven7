name: Generate Profile 3D Contributions

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate 3D Contribution Graph
        uses: yashi00/profile-3d-contrib@v1
        with:
          github_username: huntedraven7
          outputs: |
            main/profile-3d-contrib/profile-night-rainbow.svg

      - name: Upload 3D Graph
        uses: actions/upload-artifact@v4
        with:
          name: 3d-contrib
          path: main/profile-3d-contrib/*.svg

      - name: Commit and Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add main/profile-3d-contrib/profile-night-rainbow.svg
          git diff --staged --quiet || git commit -m "chore: update 3D contribution graph"
          git push
